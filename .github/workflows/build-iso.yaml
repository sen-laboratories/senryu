name: SENryu ISO Build Pipeline

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-senryu-iso:
    runs-on: ubuntu-latest
    container:
      image: haiku/cross-compiler:x86_64-r1beta4
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true
    
      - name: Install Build Essentials
        run: |
          apt-get update
          apt-get install -y \
            git build-essential nasm xxd python3-pillow \
            autoconf automake bison flex gawk \
            libz-dev libcurl4-openssl-dev
      
      - name: Configure Haiku Build
        run: |
          # We use the pre-built cross-tools in the container
          # This saves hours of compilation time
          ./configure --build-cross-tools x86_64 --cross-tools-source ../buildtools --distro-compatibility compatible

      - name: Build SENryu ISO
        run: |
          # Build the nightly anyboot image (the ISO)
          # We increase the 'j' count for the GitHub worker's CPU
          jam -q -j$(nproc) @nightly-anyboot

      - name: Upload SENryu ISO
        uses: actions/upload-artifact@v4
        with:
          name: senryu-nightly-iso
          path: generated/objects/haiku/x86_64/release/haiku-nightly-anyboot.image
